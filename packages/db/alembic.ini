# NovrSOC V2 migrations (Alembic). Run from packages/db:
#   NOVRSOC_MIGRATION_DATABASE_URL=postgresql+psycopg://novrsoc_owner:...@127.0.0.1:55432/novrsoc_v2_dev \
#     ../../apps/api/.venv/Scripts/alembic upgrade head
# The URL comes from the environment only. It is never written in this file.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
