# /etc/nginx/sites-available/novrsoc  (Server 2). TLS terminates here; the API and web listen on 127.0.0.1 only.
# The SAME origin serves the web app and /api/v1 (cookies are same-site; the browser never calls another host).
# Organization portals: <name>.<portal base domain> on the same server (one deployment for every organization). This
# needs a wildcard DNS record and a wildcard certificate (Let's Encrypt issues those through the DNS-01 challenge only).
# `$host` passed to the API is one of THESE names only: every other Host is dropped by the default server below, so a
# forged Host header never reaches the API. The API decides what a host may do (NOVRSOC_PLATFORM_HOSTS,
# NOVRSOC_PORTAL_BASE_DOMAIN); X-Forwarded-Host is not trusted in production.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;          # an unknown TLS server name gets no certificate at all
    return 444;
}

server {
    listen 80;
    server_name <public hostname> *.<portal base domain>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <public hostname> *.<portal base domain>;
    ssl_certificate     /etc/letsencrypt/live/<portal base domain>/fullchain.pem;     # covers <public hostname> and *.<portal base domain>
    ssl_certificate_key /etc/letsencrypt/live/<portal base domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 4m;

    # The VMS worker runs on this host (compose service vms-worker) and reaches the API on the internal compose
    # network only: its protocol is never served through NGINX.
    location ^~ /api/v1/vms/worker/ { return 403; }
    # Machine endpoints of the Server 1 services (forwarder, TAXII feeder) are reachable ONLY over WireGuard.
    location ~ ^/api/v1/(soc/ingest|insights/ingest)/ {
        allow <WireGuard network CIDR>;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/docs { return 404; }   # docs are disabled in production by the API as well
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
