# /etc/nginx/sites-available/novrsoc  (Server 2). TLS terminates here; the API and web listen on 127.0.0.1 only.
# The SAME origin serves the web app and /api/v1 (cookies are same-site; the browser never calls another host).
server {
    listen 80;
    server_name <public hostname>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <public hostname>;
    ssl_certificate     /etc/letsencrypt/live/<public hostname>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<public hostname>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 4m;

    # The VMS worker runs on this host (compose service vms-worker) and reaches the API on the internal compose
    # network only: its protocol is never served through NGINX.
    location ^~ /api/v1/vms/worker/ { return 403; }
    # Machine endpoints of the Server 1 services (forwarder, TAXII feeder) are reachable ONLY over WireGuard.
    location ~ ^/api/v1/(soc/ingest|insights/ingest)/ {
        allow <WireGuard network CIDR>;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/docs { return 404; }   # docs are disabled in production by the API as well
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
